name: Import Unity source archive
on:
  push:
    paths:
      - ".github/workflows/import-source.yml"
      - "tools/_import/**"
  workflow_dispatch:
jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch archive and replace tree
        shell: bash --noprofile --norc {0}
        run: |
          EXPECT=43c4d872a8842c433d6277398080c2d0ddf940303a1ec7e1d9c0ea6cc0b5053e
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36'
          fetched=0
          try_url() {
            url="$1"
            echo "TRY $url"
            rm -f /tmp/unity-src.tar.gz
            curl -L --retry 5 --retry-delay 4 --retry-all-errors --max-time 180 -A "$UA" -o /tmp/unity-src.tar.gz "$url" || true
            if [ ! -f /tmp/unity-src.tar.gz ]; then
              echo "no file"
              return 1
            fi
            got=$(sha256sum /tmp/unity-src.tar.gz | awk '{print $1}')
            echo "downloaded sha256 $got size $(wc -c < /tmp/unity-src.tar.gz)"
            if [ "$got" = "$EXPECT" ]; then
              return 0
            fi
            return 1
          }
          if try_url "https://filebin.net/unity6-1789803902/unity-src.tar.gz"; then fetched=1; fi
          if [ "$fetched" != 1 ]; then
            if try_url "https://n.uguu.se/XuYfuocP.tar.gz"; then fetched=1; fi
          fi
          if [ "$fetched" != 1 ] && [ -f tools/_import/p000.b64 ] && [ -f tools/_import/p112.b64 ]; then
            echo "Using in-repo base64 parts"
            cat tools/_import/p*.b64 | base64 -d > /tmp/unity-src.tar.gz
            got=$(sha256sum /tmp/unity-src.tar.gz | awk '{print $1}')
            echo "archive sha256 $got"
            if [ "$got" = "$EXPECT" ]; then fetched=1; fi
          fi
          if [ "$fetched" != 1 ]; then
            echo "No complete verified archive yet; skipping import"
            exit 0
          fi
          python3 -c 'import tarfile,pathlib; root=pathlib.Path("imported"); root.mkdir(exist_ok=True); tarfile.open("/tmp/unity-src.tar.gz","r:gz").extractall(root); print("extracted", sum(1 for p in root.rglob("*") if p.is_file()), "files")'
          rsync -a --delete --exclude '.git' --exclude '.github' imported/ ./
          rm -rf imported tools/_import
          rm -f _probe_fileurl.txt .github/workflows/import-source.yml
          git config user.name "GoshaWu"
          git config user.email "goshawu1024@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Import full Unity 6 source tree from archive"
            git push
          fi
