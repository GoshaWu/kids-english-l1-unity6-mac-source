name: Import Unity source archive
on:
  push:
    paths:
      - ".github/workflows/import-source.yml"
      - "tools/_import/**"
  workflow_dispatch:
jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download archive and replace tree
        run: |
          set -euo pipefail
          EXPECT=43c4d872a8842c433d6277398080c2d0ddf940303a1ec7e1d9c0ea6cc0b5053e
          ok=0
          for url in \
            "https://litter.catbox.moe/j1vlu9.gz" \
            "https://n.uguu.se/ZXkWmzdR.tar.gz"; do
            echo "trying $url"
            if curl -fsSL --retry 3 --retry-delay 2 "$url" -o /tmp/unity-src.tar.gz; then
              got=$(sha256sum /tmp/unity-src.tar.gz | awk '{print $1}')
              echo "got $got"
              if [ "$got" = "$EXPECT" ]; then
                ok=1
                break
              fi
            fi
          done
          test "$ok" = 1
          python3 - <<'PY'
          import tarfile, pathlib
          root = pathlib.Path("imported")
          root.mkdir()
          with tarfile.open("/tmp/unity-src.tar.gz", "r:gz") as tf:
              tf.extractall(root)
          print("extracted", sum(1 for p in root.rglob("*") if p.is_file()), "files")
          PY
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github' \
            imported/ ./
          rm -rf imported tools/_import
          rm -f _probe_fileurl.txt
          rm -f .github/workflows/import-source.yml
          git config user.name "GoshaWu"
          git config user.email "goshawu1024@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Import full Unity 6 source tree from archive"
            git push
          fi
