name: Import Unity source archive
on:
  push:
    paths:
      - ".github/workflows/import-source.yml"
      - "tools/_import/**"
  workflow_dispatch:
jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode archive and replace tree
        run: |
          EXPECT=43c4d872a8842c433d6277398080c2d0ddf940303a1ec7e1d9c0ea6cc0b5053e
          src=""
          if [ -f tools/_import/pack_00.b64 ] && [ -f tools/_import/pack_22.b64 ]; then
            echo "Using pack_*.b64"
            cat tools/_import/pack_*.b64 | base64 -d > /tmp/unity-src.tar.gz || src=fail
          elif [ -f tools/_import/p000.b64 ] && [ -f tools/_import/p112.b64 ]; then
            echo "Using p*.b64"
            cat tools/_import/p*.b64 | base64 -d > /tmp/unity-src.tar.gz || src=fail
          else
            echo "Parts incomplete ($(ls tools/_import 2>/dev/null | wc -l) files); skipping"
            exit 0
          fi
          if [ "$src" = fail ] || [ ! -s /tmp/unity-src.tar.gz ]; then
            echo "decode failed; skipping"
            exit 0
          fi
          got=$(sha256sum /tmp/unity-src.tar.gz | awk '{print $1}')
          echo "archive sha256 $got"
          if [ "$got" != "$EXPECT" ]; then
            echo "hash mismatch; skipping"
            exit 0
          fi
          python3 -c 'import tarfile,pathlib; root=pathlib.Path("imported"); root.mkdir(exist_ok=True); tarfile.open("/tmp/unity-src.tar.gz","r:gz").extractall(root); print("extracted", sum(1 for p in root.rglob("*") if p.is_file()), "files")'
          rsync -a --delete --exclude '.git' --exclude '.github' imported/ ./
          rm -rf imported tools/_import
          rm -f _probe_fileurl.txt
          rm -f .github/workflows/import-source.yml
          git config user.name "GoshaWu"
          git config user.email "goshawu1024@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Import full Unity 6 source tree from archive"
            git push
          fi
