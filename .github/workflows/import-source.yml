name: Import Unity source archive
on:
  push:
    paths:
      - ".github/workflows/import-source.yml"
      - "tools/_import/**"
  workflow_dispatch:
jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch archive and extract in place
        shell: bash --noprofile --norc {0}
        run: |
          set -euo pipefail
          EXPECT=43c4d872a8842c433d6277398080c2d0ddf940303a1ec7e1d9c0ea6cc0b5053e
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36'
          ok=0
          for url in \
            "https://filebin.net/unity6-1789803902/unity-src.tar.gz" \
            "https://n.uguu.se/XuYfuocP.tar.gz"
          do
            echo "TRY $url"
            rm -f /tmp/unity-src.tar.gz
            curl -L --retry 5 --retry-delay 4 --retry-all-errors --max-time 180 -A "$UA" -o /tmp/unity-src.tar.gz "$url" || true
            if [ -f /tmp/unity-src.tar.gz ]; then
              got=$(sha256sum /tmp/unity-src.tar.gz | awk '{print $1}')
              echo "sha256 $got size $(wc -c < /tmp/unity-src.tar.gz)"
              if [ "$got" = "$EXPECT" ]; then
                ok=1
                break
              fi
            fi
          done
          if [ "$ok" != 1 ]; then
            echo "download failed"
            exit 1
          fi
          tar -xzf /tmp/unity-src.tar.gz
          test -f ProjectSettings/ProjectVersion.txt
          grep -q 6000.6.1f1 ProjectSettings/ProjectVersion.txt
          test "$(wc -c < Assets/Art/anim_bunny_wave.png)" -eq 954
          test -f docs/MAC_UNITY6.md
          test -f Assets/Scripts/Levels/HelloFriendsLevel.cs
          git config user.name "GoshaWu"
          git config user.email "goshawu1024@gmail.com"
          git add -A -f
          echo "staged $(git diff --cached --name-only | wc -l) paths"
          git diff --cached --stat | tail -20
          test "$(git diff --cached --name-only | wc -l)" -gt 40
          rm -f .github/workflows/import-source.yml
          git add -A
          git commit -m "Import full Unity 6 source tree from archive"
          git push
